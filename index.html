<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Khóa Màn Hình Tạm</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body, html { width: 100%; height: 100%; background-color: #000000; overflow: hidden; font-family: system-ui, sans-serif; }
    
    /* Màn hình khóa chờ chìm */
    #lockScreen {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #333333; text-align: center;
    }
    #clock { font-size: 48px; font-weight: 300; color: #222222; margin-bottom: 10px; }
    #hint { font-size: 14px; color: #1a1a1a; }
  </style>
</head>
<body>
  <div id="lockScreen">
    <div id="clock">00:00</div>
    <p id="hint">Chạm 2 lần liên tục để mở khóa</p>
  </div>
  <script src="main.js"></script>
</body>
</html
