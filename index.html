<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdMob 6 Ad Types Test Demo</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // Bắt lỗi JS trực tiếp ngay trong HTML
    window.onerror = function (msg, url, line) {
      alert("LỖI JS: " + msg + "\nDòng: " + line);
      return true;
    };
  </script>
</head>
<body>

  <div class="card">
    <h2>Thử Nghiệm 6 Loại Quảng Cáo AdMob 🚀</h2>
    <div class="btn-grid">
      <button id="btnBanner">1. Hiện Banner Ad (320x50)</button>
      <button id="btnAppOpen">2. Test App Open Ad (Mở App)</button>
      <button id="btnInterstitial">3. Test Interstitial Ad (Xen kẽ)</button>
      <button id="btnRewarded" class="reward">4. Test Rewarded Video (Xem lấy quà)</button>
      <button id="btnRewardedInter" class="reward">5. Test Rewarded Interstitial</button>
      <button id="btnNative" class="native">6. Test Native Ad (Thẻ 300x250)</button>
    </div>
  </div>

  <div class="card">
    <h3>Trạng Thái Nhật Ký (Log Test)</h3>
    <div id="logBox">Đang khởi tạo AdMob SDK...</div>
  </div>

  <script src="main.js"></script>
</body>
</html>
