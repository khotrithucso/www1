name: Build Android APK AdMob Test
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. Tạo thư mục www và copy CSS/HTML
      - run: npm init -y
      - run: mkdir -p www
      - run: cp index.html style.css www/ 2>/dev/null || true

      # 2. Cài đặt Capacitor, AdMob & esbuild để đóng gói JS
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob esbuild

      # 3. ĐÓNG GÓI MAIN.JS CÓ CHỨA IMPORT THÀNH FILE WWW/MAIN.JS
      - run: npx esbuild main.js --bundle --outfile=www/main.js

      # 4. Khởi tạo Capacitor & Nền tảng Android
      - run: npx cap init "App AdMob Test" "com.trithucso.admobtest" --web-dir www
      - run: npx cap add android

      # 5. CHÈN MÃ ADMOB APPLICATION_ID VÀO ANDROIDMANIFEST.XML
      - run: |
          sed -i '/<\/application>/i \    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' android/app/src/main/AndroidManifest.xml

      # 6. Sửa lỗi xung đột thư viện Kotlin trùng lặp
      - run: |
          echo "
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          " >> android/app/build.gradle

      # 7. Đồng bộ Capacitor sang Android
      - run: npx cap sync

      # 8. Biên dịch file APK
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      # 9. Tải file APK kết quả lên Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
