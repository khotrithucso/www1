name: Build Android APK va AAB
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Tự động tạo thư mục www và sao chép các file web vào
      - run: mkdir -p www && cp index.html main.js style.css www/ 2>/dev/null || true

      - run: npm init -y
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android
      - run: npx cap init "App Cua Toi" "com.trithucso.appwww1" --web-dir www
      - run: npx cap add android
      - run: npx cap sync
      - run: cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
