name: Build Android APK AdMob Test
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 1. Tạo thư mục www và sao chép file web vào
      - run: npm init -y
      - run: mkdir -p www
      - run: cp index.html main.js style.css www/ 2>/dev/null || true

      # 2. Cài đặt Capacitor & Plugin AdMob
      - run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob

      # 3. Khởi tạo Capacitor & Nền tảng Android
      - run: npx cap init "App AdMob Test" "com.trithucso.admobtest" --web-dir www
      - run: npx cap add android

      # 4. CHÈN MÃ ADMOB APPLICATION_ID VÀO ANDROIDMANIFEST.XML ĐỂ TRÁNH CRASH OUT APP
      - run: |
          sed -i '/<\/application>/i \    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' android/app/src/main/AndroidManifest.xml

      # 5. Sửa lỗi xung đột thư viện Kotlin trùng lặp
      - run: |
          echo "
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          " >> android/app/build.gradle

      # 6. Đồng bộ Capacitor sang thư mục Android
      - run: npx cap sync

      # 7. Cấp quyền thực thi gradlew và biên dịch file APK
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      # 8. Tải file APK kết quả lên Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
